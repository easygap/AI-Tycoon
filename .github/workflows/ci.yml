name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 은 EOL(2025-04) + node --check 가 ES 모듈 자동 감지를 못 해서 제외.
        # 지원 LTS/Current 라인만 검증한다.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint (node --check)
        run: npm run lint
        timeout-minutes: 1
      - name: Run smoke test
        run: npm test
        timeout-minutes: 2
